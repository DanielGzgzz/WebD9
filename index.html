<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanilla WebGL D9 Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="glcanvas"></canvas>
    <div id="ui">
        <h2>D9 Controls</h2>
        <p><b>Up/Down:</b> Move Forward/Backward</p>
        <p><b>Left/Right:</b> Turn Left/Right</p>
        <p><b>< / > :</b> Raise/Lower Blade</p>
        <p><b>[ / ] :</b> Camera Angle Up/Down</p>
    </div>
    <div id="objectiveUI">
        <h2>Objective</h2>
        <p id="objectiveText">Clear the rubble blocking the road!</p>
        <div class="progress-bar">
            <div id="progressFill"></div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
